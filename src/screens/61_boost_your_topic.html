<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom styles for the Clean Chaos aesthetic */
        .brutalist-border {
            border: 2px solid theme('colors.primary');
        }
        .brutalist-border-lime {
            border: 2px solid theme('colors.primary-fixed');
        }
        .hard-shadow-primary {
            box-shadow: 4px 4px 0 0 theme('colors.primary-fixed');
        }
        .hard-shadow-secondary {
            box-shadow: 4px 4px 0 0 theme('colors.secondary');
        }
        .duration-selector.active {
            border-color: theme('colors.primary-fixed');
            background-color: theme('colors.primary-fixed');
            color: theme('colors.on-primary-fixed');
        }

<body class="bg-background text-on-background antialiased flex flex-col min-h-[844px] max-w-[390px] mx-auto relative overflow-hidden">
<!-- TopAppBar (Suppressed per logic, keeping a simple back header for transactional flow) -->
<header class="flex items-center px-margin-mobile py-4 w-full z-50 fixed top-0 bg-background">
<button class="text-primary hover:text-primary-fixed transition-colors active:opacity-80 flex items-center justify-center p-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile pt-[80px] pb-[100px] gap-stack-md z-10 relative">
<!-- Header Section -->
<div class="flex flex-col gap-stack-sm">
<h1 class="font-display-lg text-display-lg text-primary uppercase">Boost<br>Topic</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Amplify #StartupDrama to targeted demographics.</p>
</div>
<!-- Topic Card Preview -->
<div class="bg-surface brutalist-border p-4 flex flex-col gap-stack-sm relative overflow-hidden">
<!-- Decorative blur element to fit aesthetic -->
<div class="absolute -top-10 -right-10 w-24 h-24 bg-secondary opacity-20 rounded-full blur-[20px]"></div>
<div class="flex justify-between items-start">
<span class="font-label-mono text-label-mono uppercase text-primary-fixed tracking-widest">Targeting</span>
<span class="material-symbols-outlined text-primary-fixed">target</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mt-2">#StartupDrama</h2>
<div class="flex flex-col gap-2 mt-4 pt-4 border-t-2 border-surface-container-high">
<div class="flex justify-between items-center">
<span class="font-label-mono text-label-mono text-on-surface-variant">Est. Reach</span>
<span class="font-label-mono text-label-mono text-primary">+1,200 matches</span>
</div>
<!-- Progress indicator styled as data loading bar -->
<div class="w-full h-2 brutalist-border p-[1px]">
<div class="bg-primary-fixed h-full w-[80%]"></div>
</div>
</div>
</div>
<!-- Duration Selectors -->
<div class="flex flex-col gap-stack-sm mt-stack-sm">
<h3 class="font-label-mono text-label-mono uppercase text-primary tracking-widest">Select Duration</h3>
<div class="grid grid-cols-3 gap-unit">
<button class="duration-selector bg-void border-2 border-surface-container-highest p-4 flex flex-col items-center justify-center gap-2 hover:border-primary-fixed transition-colors">
<span class="font-headline-lg-mobile text-headline-lg-mobile">30</span>
<span class="font-label-mono text-label-mono">MIN</span>
</button>
<button class="duration-selector active p-4 flex flex-col items-center justify-center gap-2">
<span class="font-headline-lg-mobile text-headline-lg-mobile">1</span>
<span class="font-label-mono text-label-mono">HR</span>
</button>
<button class="duration-selector bg-void border-2 border-surface-container-highest p-4 flex flex-col items-center justify-center gap-2 hover:border-primary-fixed transition-colors">
<span class="font-headline-lg-mobile text-headline-lg-mobile">3</span>
<span class="font-label-mono text-label-mono">HR</span>
</button>
</div>
</div>
<!-- Spacer to push action to bottom -->
<div class="flex-1"></div>
<!-- Action Button -->
<div class="w-full fixed bottom-0 left-0 p-margin-mobile bg-gradient-to-t from-background to-transparent z-50">
<button class="w-full bg-primary-fixed text-on-primary-fixed font-label-mono text-label-mono font-bold uppercase py-4 hard-shadow-secondary hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-[2px_2px_0_0_theme('colors.secondary')] active:translate-y-[4px] active:translate-x-[4px] active:shadow-none transition-all flex justify-center items-center gap-2">
<span class="material-symbols-outlined">rocket_launch</span>
                Boost Topic
            </button>
</div>
</main>
<!-- BottomNavBar (Suppressed per logic for transactional flow) -->
<script>
        // Simple micro-interaction for duration selectors
        document.querySelectorAll('.duration-selector').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.duration-selector').forEach(b => {
                    b.classList.remove('active');
                    b.classList.add('bg-void', 'border-2', 'border-surface-container-highest');
                });
                button.classList.add('active');
                button.classList.remove('bg-void', 'border-surface-container-highest');
            });
        });
    </script>
