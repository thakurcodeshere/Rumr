<style>
        .loading-bar-step {
            animation: step-loading 2s infinite steps(10, end);
        }
        @keyframes step-loading {
            0% { width: 0; }
            100% { width: 100%; }
        }
        
        /* Noise overlay for that gritty editorial feel */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
      </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md" style="width: 390px; height: 844px; margin: 0 auto; outline: 1px solid #333;">
<div class="noise-overlay"></div>
<!-- Central Branding -->
<main class="flex-1 flex flex-col items-center justify-center w-full px-margin-mobile relative z-10">

        </p>
</main>
<!-- Bottom Loading Indicator -->
<footer class="w-full px-margin-mobile pb-stack-lg relative z-10">
<div class="flex flex-col items-center gap-unit">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase text-[10px]">Decrypting...</span>
<div class="w-48 h-2 border-2 border-outline-variant bg-surface relative overflow-hidden">
<div class="h-full bg-primary-container loading-bar-step absolute top-0 left-0"></div>
</div>
</div>
</footer>
