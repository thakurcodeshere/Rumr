<style>
        body {
            background-color: #000000; /* Void */
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        
        .topic-card {
            background-color: #1A1A1A; /* Surface Grey */
            border: 2px solid #ffffff;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .topic-card.selected {
            border-color: #c3f400; /* Toxic Lime */
        }
        
        .topic-card.selected::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 12px;
            height: 12px;
            background-color: #c3f400;
        }

        .btn-primary {
            background-color: #c3f400;
            color: #000000;
            text-transform: uppercase;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            box-shadow: 4px 4px 0px 0px #A855F7; /* Electric Purple hard shadow */
            transform: translate(-2px, -2px);
        }

        .btn-secondary {
            background-color: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        
        .btn-secondary:hover {
            box-shadow: 4px 4px 0px 0px #A855F7;
            transform: translate(-2px, -2px);
        }
        
        /* Progress Indicator Data Loading Bar Style */
        .progress-bar-container {
            border: 2px solid #ffffff;
            height: 16px;
            width: 100%;
            background-color: #000000;
        }
        
        .progress-bar-fill {
            background-color: #c3f400;
            height: 100%;
            width: 20%; /* 1 of 5 steps */
            transition: width 0.3s steps(5, end);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen max-w-[390px] mx-auto overflow-x-hidden relative">
<!-- Header Section -->
<header class="px-margin-mobile pt-stack-lg pb-stack-md flex flex-col gap-stack-sm border-b-2 border-surface-variant z-10 bg-surface">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase">WHAT'S YOUR KIND OF CHAOS?</h1>
<p class="font-label-mono text-label-mono text-on-surface-variant flex justify-between items-center">
<span class="">Pick at least 5 topics.</span>
<span class="text-primary-container" id="selection-count">0/5</span>
</p>
<!-- Brutalist Progress Bar -->
<div class="progress-bar-container mt-unit">
<div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-stack-md flex flex-col gap-stack-md z-10 bg-surface relative">
<!-- Atmospheric Background Pattern -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#353535 1px, transparent 1px); background-size: 16px 16px;"></div>
<!-- Topic Grid -->
<div class="grid grid-cols-2 gap-gutter relative z-20">
<!-- Topic Card 1 -->
<button class="topic-card flex flex-col justify-between p-gutter h-32 text-left group" onclick="toggleSelection(this)">
<span class="font-headline-lg-mobile text-[20px] leading-tight text-primary">Ghosting</span>
<span class="font-label-mono text-[10px] text-on-surface-variant group-[.selected]:text-primary-container uppercase">MATCH_RATE: 92%</span>
</button>
<!-- Topic Card 2 -->
<button class="topic-card flex flex-col justify-between p-gutter h-32 text-left group" onclick="toggleSelection(this)">
<span class="font-headline-lg-mobile text-[20px] leading-tight text-primary">Office Drama</span>
<span class="font-label-mono text-[10px] text-on-surface-variant group-[.selected]:text-primary-container uppercase">TRENDING</span>
</button>
<!-- Topic Card 3 -->
<button class="topic-card flex flex-col justify-between p-gutter h-32 text-left group" onclick="toggleSelection(this)">
<span class="font-headline-lg-mobile text-[20px] leading-tight text-primary">Dating</span>
<span class="font-label-mono text-[10px] text-on-surface-variant group-[.selected]:text-primary-container uppercase">MATCH_RATE: 88%</span>
</button>
<!-- Topic Card 4 -->
<button class="topic-card flex flex-col justify-between p-gutter h-32 text-left group" onclick="toggleSelection(this)">
<span class="font-headline-lg-mobile text-[20px] leading-tight text-primary">Startup Life</span>
<span class="font-label-mono text-[10px] text-on-surface-variant group-[.selected]:text-primary-container uppercase">VOLATILE</span>
</button>
<!-- Topic Card 5 -->
<button class="topic-card flex flex-col justify-between p-gutter h-32 text-left group" onclick="toggleSelection(this)">
<span class="font-headline-lg-mobile text-[20px] leading-tight text-primary">Bollywood</span>
<span class="font-label-mono text-[10px] text-on-surface-variant group-[.selected]:text-primary-container uppercase">MATCH_RATE: 75%</span>
</button>
<!-- Topic Card 6 -->
<button class="topic-card flex flex-col justify-between p-gutter h-32 text-left group" onclick="toggleSelection(this)">
<span class="font-headline-lg-mobile text-[20px] leading-tight text-primary">Unpopular Opinions</span>
<span class="font-label-mono text-[10px] text-on-surface-variant group-[.selected]:text-primary-container uppercase">HIGH FRICTION</span>
</button>
</div>
<!-- Create Action -->
<button class="btn-secondary w-full py-stack-sm font-label-mono text-label-mono flex items-center justify-center gap-unit uppercase z-20">
<span class="material-symbols-outlined text-[16px]">add</span>
            Create Topic
        </button>
<!-- Empty space to push continue button down if needed -->
<div class="flex-grow"></div>
</main>
<!-- Sticky Footer Action -->
<div class="sticky bottom-0 w-full px-margin-mobile pb-margin-mobile pt-stack-sm bg-surface z-30 border-t-2 border-surface-variant">
<button class="btn-primary w-full py-stack-sm font-label-mono text-label-mono opacity-50 cursor-not-allowed" disabled="" id="continue-btn">
            CONTINUE
        </button>
</div>
<script>
        let selectedCount = 0;
        const requiredCount = 5;
        const countDisplay = document.getElementById('selection-count');
        const progressBar = document.getElementById('progress-fill');
        const continueBtn = document.getElementById('continue-btn');

        function toggleSelection(btn) {
            const isSelected = btn.classList.toggle('selected');
            
            if (isSelected) {
                selectedCount++;
            } else {
                selectedCount--;
            }

            // Update UI
            countDisplay.innerText = `${selectedCount}/${requiredCount}`;
            
            // Stepped progress bar logic (0, 20, 40, 60, 80, 100%)
            const progressPercentage = Math.min((selectedCount / requiredCount) * 100, 100);
            progressBar.style.width = `${progressPercentage}%`;

            // Validate Continue button
            if (selectedCount >= requiredCount) {
                continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                continueBtn.removeAttribute('disabled');
            } else {
                continueBtn.classList.add('opacity-50', 'cursor-not-allowed');
                continueBtn.setAttribute('disabled', 'true');
            }
        }
    </script>




</body></html>
