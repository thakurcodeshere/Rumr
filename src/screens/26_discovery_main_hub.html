<!-- Simple interaction script for stack effect -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stack = document.getElementById('cardStack');
            let isDragging = false;
            let startY = 0;
            let topCard = stack.lastElementChild;
            
            // Very basic interaction demonstration
            stack.addEventListener('mousedown', (e) => {
                isDragging = true;
                startY = e.clientY;
            });
            
            stack.addEventListener('mouseup', () => {
                if(isDragging) {
                    isDragging = false;
                    topCard.style.transform = `translateY(0px) scale(1)`;
                }
            });
            
            stack.addEventListener('mousemove', (e) => {
                if(!isDragging) return;
                const deltaY = e.clientY - startY;
                if(deltaY < 0) { // Dragging up
                    topCard.style.transform = `translateY(${deltaY}px) scale(1)`;
                }
            });
            
            // Touch support
            stack.addEventListener('touchstart', (e) => {
                isDragging = true;
                startY = e.touches[0].clientY;
            });
            
            stack.addEventListener('touchend', () => {
                if(isDragging) {
                    isDragging = false;
                    topCard.style.transform = `translateY(0px) scale(1)`;
                }
            });
            
            stack.addEventListener('touchmove', (e) => {
                if(!isDragging) return;
                const deltaY = e.touches[0].clientY - startY;
                if(deltaY < 0) {
                    topCard.style.transform = `translateY(${deltaY}px) scale(1)`;
                }
            });
        });
    </script>
