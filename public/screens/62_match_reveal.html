<style>
        body {
            background-color: #000000; /* Void background */
            color: #e5e2e1;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* For fixed size presentation */
        }
        
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .screen-container {
            width: 100%;
            max-width: 390px;
            height: 844px;
            margin: 0 auto;
            background-color: #1A1A1A; /* Surface Grey */
            position: relative;
            display: flex;
            flex-direction: column;
            border-left: 2px solid #353535;
            border-right: 2px solid #353535;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 #A855F7; /* Electric Purple */
            animation: glitch-anim 2s infinite linear alternate-reverse;
            clip: rect(44px, 450px, 56px, 0);
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 #c3f400; /* Toxic Lime */
            animation: glitch-anim2 3s infinite linear alternate-reverse;
            clip: rect(44px, 450px, 56px, 0);
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 83px, 0); }
            20% { clip: rect(65px, 9999px, 2px, 0); }
            40% { clip: rect(23px, 9999px, 54px, 0); }
            60% { clip: rect(87px, 9999px, 45px, 0); }
            80% { clip: rect(12px, 9999px, 91px, 0); }
            100% { clip: rect(54px, 9999px, 32px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(89px, 9999px, 12px, 0); }
            20% { clip: rect(34px, 9999px, 76px, 0); }
            40% { clip: rect(9px, 9999px, 55px, 0); }
            60% { clip: rect(78px, 9999px, 23px, 0); }
            80% { clip: rect(45px, 9999px, 88px, 0); }
            100% { clip: rect(21px, 9999px, 67px, 0); }
        }
        
        .brutalist-button-primary {
            background-color: #c3f400; /* Toxic Lime */
            color: #000000;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            border: 2px solid #c3f400;
            transition: all 0.2s ease;
        }
        
        .brutalist-button-primary:hover, .brutalist-button-primary:active {
            box-shadow: 4px 4px 0 #A855F7; /* Electric Purple hard shadow */
            transform: translate(-2px, -2px);
        }

        .gossip-tag {
            background-color: #A855F7; /* Electric Purple */
            color: #000000;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            border-radius: 0;
            text-transform: uppercase;
        }
