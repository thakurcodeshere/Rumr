<body class="flex items-center justify-center min-h-screen">
<!-- Mobile Container (390x844px equivalent) -->
<main class="w-full max-w-[390px] h-screen max-h-[844px] bg-background relative flex flex-col overflow-hidden border-2 border-surface-container-highest md:rounded-xl shadow-2xl">
<!-- Background Blur/Atmosphere -->

<div class="absolute top-[-10%] left-[-20%] w-[150%] h-[50%] bg-secondary-container opacity-20 blur-[60px] rounded-full mix-blend-screen"></div>
</div>
<!-- Content Canvas -->
<div class="relative z-10 flex flex-col flex-1 px-margin-mobile pt-stack-lg pb-margin-mobile">
<!-- Header Section -->
<header class="mb-stack-lg text-center">
<span class="material-symbols-outlined text-primary-fixed mb-stack-sm" style="font-size: 48px; font-variation-settings: 'FILL' 1;">shield</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase tracking-tighter">YOUR SPACE</h1>
<div class="w-16 h-1 bg-primary-fixed mx-auto mt-stack-sm"></div>
</header>
<!-- Safety Promises List -->
<ul class="flex-1 flex flex-col gap-stack-md justify-center">
<!-- Promise 1 -->
<li class="flex items-start gap-gutter bg-surface-container border-2 border-surface-container-highest p-4 relative group">
<!-- Hard Shadow Effect (simulated with before element) -->
<div class="absolute inset-0 border-2 border-primary-fixed translate-x-[4px] translate-y-[4px] -z-10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-secondary mt-1">visibility_off</span>
<div>
<h2 class="font-label-mono text-label-mono text-secondary mb-1">PRIVACY</h2>
<p class="font-body-md text-body-md text-on-surface">You control what you reveal.</p>
</div>
</li>
<!-- Promise 2 -->
<li class="flex items-start gap-gutter bg-surface-container border-2 border-surface-container-highest p-4 relative group">
<div class="absolute inset-0 border-2 border-error translate-x-[4px] translate-y-[4px] -z-10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-error mt-1">flag</span>
<div>
<h2 class="font-label-mono text-label-mono text-error mb-1">MODERATION</h2>
<p class="font-body-md text-body-md text-on-surface">Report harmful content.</p>
</div>
</li>
<!-- Promise 3 -->
<li class="flex items-start gap-gutter bg-surface-container border-2 border-surface-container-highest p-4 relative group">
<div class="absolute inset-0 border-2 border-primary-fixed translate-x-[4px] translate-y-[4px] -z-10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-primary-fixed mt-1">block</span>
<div>
<h2 class="font-label-mono text-label-mono text-primary-fixed mb-1">CONTROL</h2>
<p class="font-body-md text-body-md text-on-surface">Block anyone, anytime.</p>
</div>
</li>
<!-- Promise 4 -->
<li class="flex items-start gap-gutter bg-surface-container border-2 border-surface-container-highest p-4 relative group">
<div class="absolute inset-0 border-2 border-secondary translate-x-[4px] translate-y-[4px] -z-10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-secondary mt-1">gpp_bad</span>
<div>
<h2 class="font-label-mono text-label-mono text-secondary mb-1">NO HARASSMENT</h2>
<p class="font-body-md text-body-md text-on-surface">Personal targeting isn't allowed.</p>
</div>
</li>
</ul>

<div class="mt-stack-lg pb-stack-md">
<button class="w-full bg-primary-fixed text-on-primary-fixed font-label-mono text-label-mono py-4 uppercase border-2 border-transparent hover:border-primary transition-all relative group overflow-hidden">
