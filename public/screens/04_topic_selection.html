        @keyframes stepProgress {
            0% { width: 33%; }
            100% { width: 66%; }
        }
        .progress-step {
            animation: stepProgress 1s steps(4, end) forwards;
        }

        /* Hide scrollbar for clean look */

<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile" style="height: 844px; overflow: hidden;">
<!-- Main Container -->
<main class="w-full flex flex-col gap-stack-lg border-2 border-surface-variant bg-surface p-margin-mobile relative" style="width: 390px; height: 844px; overflow-y: auto; margin: 0px;">
<!-- TopAppBar (Onboarding Header) -->
<header class="w-full flex flex-col gap-stack-sm border-b-2 border-outline-variant pb-4">
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-primary uppercase tracking-tighter">
                WHAT'S YOUR CHAOS?
            </h1>
<!-- Progress Indicator (Data Loading Style) -->
<div class="w-full h-3 border-2 border-outline bg-surface-container-lowest mt-2 relative">
<div class="h-full bg-primary-container progress-step" style="width: 33%;"></div>
</div>
<p class="text-label-mono font-label-mono text-on-surface-variant uppercase mt-1">STEP 2 OF 3: CALIBRATING PREFERENCES</p>
</header>
<!-- Content Area -->
<section class="flex flex-col gap-stack-md flex-1">
<p class="text-body-md font-body-md text-on-surface">Select the rumors you care about. We encrypt the rest.</p>
<!-- Topic Categories & Chips -->
<div class="flex flex-col gap-stack-md">
<!-- Category: DATING -->
<div class="flex flex-col gap-stack-sm">
<h2 class="text-label-mono font-label-mono text-outline uppercase border-b-2 border-surface-variant pb-1">DATING</h2>
<div class="flex flex-wrap gap-2 mt-2" id="chip-container-dating">
<button class="gossip-chip bg-surface border-2 border-outline text-primary font-label-mono text-label-mono px-3 py-2 uppercase hover:border-secondary-container transition-colors" onclick="this.classList.toggle('chip-selected')">Ghosting</button>
<button class="gossip-chip bg-surface border-2 border-outline text-primary font-label-mono text-label-mono px-3 py-2 uppercase hover:border-secondary-container transition-colors" onclick="this.classList.toggle('chip-selected')">Red Flags</button>
<button class="gossip-chip bg-surface border-2 border-outline text-primary font-label-mono text-label-mono px-3 py-2 uppercase hover:border-secondary-container transition-colors" onclick="this.classList.toggle('chip-selected')">Situationships</button>
</div>
</div>
<!-- Category: WORK -->
<div class="flex flex-col gap-stack-sm">
<h2 class="text-label-mono font-label-mono text-outline uppercase border-b-2 border-surface-variant pb-1">WORK</h2>

<button class="gossip-chip bg-surface border-2 border-outline text-primary font-label-mono text-label-mono px-3 py-2 uppercase hover:border-secondary-container transition-colors" onclick="this.classList.toggle('chip-selected')">Salary Gossip</button>
<button class="gossip-chip bg-surface border-2 border-outline text-primary font-label-mono text-label-mono px-3 py-2 uppercase hover:border-secondary-container transition-colors" onclick="this.classList.toggle('chip-selected')">Startup Life</button>
</div>
</div>

<button class="gossip-chip bg-surface border-2 border-outline text-primary font-label-mono text-label-mono px-3 py-2 uppercase hover:border-secondary-container transition-colors" onclick="this.classList.toggle('chip-selected')">Cancel Culture</button>
