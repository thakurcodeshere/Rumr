<!-- Rumor Overlay (Simulating loading/verification state - hidden by default) -->
<div class="fixed inset-0 bg-background/80 backdrop-blur-[20px] z-50 flex flex-col items-center justify-center hidden" id="loading-overlay">
<div class="w-16 h-16 border-2 border-primary-container border-t-transparent rounded-full animate-spin mb-stack-md"></div>
<span class="font-label-mono text-label-mono text-primary-container uppercase tracking-widest bg-surface-container px-4 py-2 border-2 border-primary-container toxic-lime-shadow">DECRYPTING...</span>
</div>
<script>
        // Simple auto-focus logic for OTP inputs
        const inputs = document.querySelectorAll('input[type="number"]');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simulate verification click
        const verifyBtn = document.querySelector('button.bg-primary-container');
        const overlay = document.getElementById('loading-overlay');

        verifyBtn.addEventListener('click', () => {
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 2000);
        });
    </script>
