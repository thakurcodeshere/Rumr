<style>
        body {
            background-color: #000000; /* Void */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .mobile-container {
            width: 390px;
            height: 844px;
            background-color: #131313; /* surface */
            position: relative;
            overflow: hidden;
            border: 2px solid #353535; /* surface-variant */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        /* Brutalist Shadows */
        .brutal-shadow-primary {
            box-shadow: 4px 4px 0px 0px #c3f400; /* Toxic Lime */
        }
        
        .brutal-shadow-secondary {
            box-shadow: 4px 4px 0px 0px #A855F7; /* Electric Purple */
        }

        /* Noise overlay for that gritty feel */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 10;
        }

        /* Custom Input Styling */
        .toxic-input {
            background-color: #000000;
            border: 2px solid #353535;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
        }
        .toxic-input:focus {
            outline: none;
            border-color: #c3f400; /* Toxic Lime */
            box-shadow: 4px 4px 0px 0px #c3f400;
        }
        .toxic-input::placeholder {
            color: #636565;
        }

        /* Chip Styling */
        .gossip-chip {
            background-color: #A855F7; /* Electric Purple */
            color: #000000;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            padding: 8px 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .gossip-chip:hover {
            background-color: #000000;
            color: #A855F7;
            border-color: #A855F7;
        }

        /* Button Styling */
        .btn-primary {
            background-color: #c3f400;
            color: #000000;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            border: none;
            padding: 16px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            box-shadow: 4px 4px 0px 0px #A855F7;
            transform: translate(-2px, -2px);
        }
        .btn-primary:active {
            transform: translate(0, 0);
            box-shadow: 0px 0px 0px 0px #A855F7;
        }
    </style>
</head>
<body>
<div class="mobile-container">
<div class="noise-overlay"></div>
<!-- TopAppBar (Transactional context, simplified/modified for 'Back' action) -->
<header class="flex justify-between items-center px-margin-mobile py-4 w-full bg-background border-b-2 border-outline-variant z-20">
<button aria-label="Go back" class="text-primary hover:text-primary-fixed-dim transition-colors cursor-pointer active:opacity-80 flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter uppercase" style="font-size: 24px;">RUMR</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile py-stack-md overflow-y-auto z-20 relative">
<div class="mb-stack-lg mt-stack-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2 uppercase">Forge<br>A Topic.</h2>
<p class="font-label-mono text-label-mono text-on-surface-variant">Inject a new thread into the void.</p>
</div>
<!-- Input Section -->
<div class="flex flex-col gap-unit relative mb-stack-md">
<label class="font-label-mono text-label-mono text-primary-fixed uppercase tracking-wider mb-2 flex items-center gap-2" for="custom-topic">
<span class="material-symbols-outlined text-[16px]">terminal</span>
                    TOPIC_NAME
                </label>
<div class="relative">
<input class="toxic-input w-full p-4 text-[16px]" id="custom-topic" maxlength="40" placeholder="ENTER_DESIGNATION..." type="text">
<!-- Blinking cursor effect simulated via border -->
</div>
<!-- Validation Logic Area -->
<div class="flex justify-between items-center mt-2 font-label-mono text-[10px]">
<span class="text-error flex items-center gap-1 opacity-80">
<span class="material-symbols-outlined text-[12px]">warning</span>
                        MAXIMUM 3 WORDS
                    </span>
<span class="text-on-surface-variant">0/40</span>
</div>
</div>
<!-- Suggestions Section (Bento/Asymmetric style layout for chips) -->
<div class="mt-stack-md flex-1">
<h3 class="font-label-mono text-label-mono text-on-surface-variant mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">insights</span>
                    TRENDING_SUGGESTIONS
                </h3>
<div class="flex flex-wrap gap-3">
<button class="gossip-chip">Corporate Drama</button>
<button class="gossip-chip">Workplace Stories</button>
<button class="gossip-chip" style="background-color: transparent; border: 2px solid #444933; color: #e5e2e1;">+ Layoffs 2024</button>
<button class="gossip-chip" style="background-color: transparent; border: 2px solid #444933; color: #e5e2e1;">+ Executive Scandals</button>
</div>
</div>
<!-- Action Area -->
<div class="mt-auto pt-stack-lg pb-stack-sm w-full">
<button class="btn-primary flex items-center justify-center gap-2">
<span class="">INITIALIZE TOPIC</span>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">add_circle</span>
</button>
</div>
</main>
<!-- Background Ambient Element (Pure CSS, no images) -->
<div class="absolute bottom-[-100px] right-[-50px] w-[300px] h-[300px] rounded-full bg-secondary-container opacity-20 blur-[80px] pointer-events-none z-0"></div>
<div class="absolute top-[20%] left-[-100px] w-[200px] h-[200px] rounded-full bg-primary-fixed opacity-10 blur-[60px] pointer-events-none z-0"></div>
</div>


</body></html>
