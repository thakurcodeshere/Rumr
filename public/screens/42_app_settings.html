<style>
        body {
            background-color: #131313;
            color: #e5e2e1;
            /* Brutalist-lite specific global styles */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .rumor-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .brutalist-border {
            border: 2px solid #353535;
        }
        
        .brutalist-border-active {
            border: 2px solid #c3f400; /* Toxic Lime */
        }

        .settings-card {
            background-color: #1a1a1a;
            transition: all 0.2s ease-in-out;
        }
        
        .settings-card:active {
            transform: scale(0.98);
            border-color: #A855F7; /* Electric Purple */
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background text-primary dark:text-primary full-width top-0 border-b-2 border-outline-variant flex justify-between items-center w-full px-margin-mobile py-4 z-50 sticky">
<button aria-label="Location" class="hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">location_on</span>
</button>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile uppercase tracking-tighter text-primary">LONDON_UK</h1>
<button aria-label="Tune" class="hover:text-primary-fixed-dim transition-colors">

</button>
</header>

<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-primary">App Settings</h2>
<p class="text-label-mono font-label-mono text-on-surface-variant uppercase">User Configuration &amp; Data Control</p>
</section>

</div>
<div class="flex flex-col">

<span class="text-label-mono font-label-mono text-primary-container mt-1">STATUS: VERIFIED</span>
</div>
</div>

<div class="flex flex-col gap-unit">
<button class="settings-card brutalist-border p-4 flex items-center justify-between text-left">
<div class="flex items-center gap-3">

</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
