<script>
    // Micro-interactions for the Topic Card to give it a 'physical' feel
    document.addEventListener('DOMContentLoaded', () => {
        const card = document.querySelector('.brutalist-border.max-w-md');
        const highlight = document.getElementById('card-highlight');

        if(card && highlight) {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Subtle tilt effect
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const tiltX = (y - centerY) / 30;
                const tiltY = -(x - centerX) / 30;
                
                card.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale3d(1.02, 1.02, 1.02)`;
                
                // Dynamic border color based on mouse position
                if(x > centerX) {
                    highlight.className = "absolute inset-0 pointer-events-none border-4 transition-colors duration-300 border-[#c3f400] opacity-50"; // Lime side
                } else {
                    highlight.className = "absolute inset-0 pointer-events-none border-4 transition-colors duration-300 border-[#A855F7] opacity-50"; // Purple side
                }
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
                highlight.className = "absolute inset-0 pointer-events-none border-4 border-transparent transition-colors duration-300";
            });
        }
    });
</script>
