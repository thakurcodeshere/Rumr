<style>
        body { background-color: #131313; color: #e5e2e1; margin: 0; padding: 0; overflow-x: hidden; }
        .brutal-border { border: 2px solid #ffffff; }
        .brutal-border-focus { border: 2px solid #c3f400; }
        .shadow-hard { box-shadow: 4px 4px 0px 0px #c3f400; }
        .shadow-hard-secondary { box-shadow: 4px 4px 0px 0px #A855F7; }
        
        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 12px;
            background: #c3f400;
            border: 2px solid #000;
            cursor: pointer;
            margin-top: -10px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:items-center md:justify-center">
<!-- Mobile Viewport Container -->
<div class="w-full h-full min-h-screen md:w-[390px] md:h-[844px] md:min-h-[844px] bg-background relative flex flex-col md:brutal-border md:shadow-hard overflow-hidden">
<!-- Header -->
<header class="flex justify-between items-center px-margin-mobile py-4 bg-background w-full z-50 border-b-2 border-primary fixed top-0 md:absolute">
<button class="text-primary hover:text-primary-fixed transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase tracking-widest text-center flex-1">Discovery Filters</h1>
<button class="font-label-mono text-label-mono text-primary-fixed hover:text-tertiary transition-colors uppercase">RESET</button>
</header>
<!-- Main Content Scroll Area -->
<main class="flex-1 overflow-y-auto pt-[72px] pb-[100px] px-margin-mobile flex flex-col gap-stack-md">
<!-- Age Range -->
<section class="flex flex-col gap-stack-sm pt-stack-sm">
<div class="flex justify-between items-end">
<h2 class="font-label-bold text-label-bold uppercase tracking-wider text-on-surface-variant">TARGET_AGE</h2>
<span class="font-label-mono text-label-mono text-primary-fixed bg-surface-container-high px-2 py-1 brutal-border">18 - 35</span>
</div>
<div class="py-4 relative">
<!-- Dual slider mock -->
<div class="h-1 bg-surface-variant w-full absolute top-1/2 -translate-y-1/2 z-0"></div>
<div class="h-1 bg-primary-fixed w-[40%] absolute top-1/2 -translate-y-1/2 left-[10%] z-10"></div>
<div class="absolute w-3 h-6 bg-primary-fixed brutal-border cursor-pointer left-[10%] top-1/2 -translate-y-1/2 z-20 shadow-[2px_2px_0_0_#A855F7]"></div>
<div class="absolute w-3 h-6 bg-primary-fixed brutal-border cursor-pointer left-[50%] top-1/2 -translate-y-1/2 z-20 shadow-[2px_2px_0_0_#A855F7]"></div>
</div>
</section>
<!-- Distance -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-bold text-label-bold uppercase tracking-wider text-on-surface-variant">PROXIMITY</h2>
<div class="grid grid-cols-3 gap-2">
<button class="bg-primary-container text-on-primary-container font-label-mono text-label-mono uppercase py-3 brutal-border shadow-hard">Nearby</button>
<button class="bg-surface-dim text-on-surface font-label-mono text-label-mono uppercase py-3 brutal-border hover:border-primary-fixed transition-colors">City</button>
<button class="bg-surface-dim text-on-surface font-label-mono text-label-mono uppercase py-3 brutal-border hover:border-primary-fixed transition-colors">Anywhere</button>
</div>
</section>
<!-- Intent -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-bold text-label-bold uppercase tracking-wider text-on-surface-variant">INTENT_VECTORS</h2>
<div class="flex flex-col gap-2">
<label class="flex items-center p-3 bg-surface-container-high brutal-border cursor-pointer group">
<input checked="" class="sr-only peer" type="checkbox">
<div class="w-5 h-5 brutal-border peer-checked:bg-primary-fixed peer-checked:border-primary-fixed flex items-center justify-center mr-3 relative">
<span class="material-symbols-outlined text-[16px] text-black absolute opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-mono text-label-mono uppercase group-hover:text-primary-fixed transition-colors">Dating</span>
</label>
<label class="flex items-center p-3 bg-surface-container-high brutal-border cursor-pointer group">
<input checked="" class="sr-only peer" type="checkbox">
<div class="w-5 h-5 brutal-border peer-checked:bg-primary-fixed peer-checked:border-primary-fixed flex items-center justify-center mr-3 relative">
<span class="material-symbols-outlined text-[16px] text-black absolute opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-mono text-label-mono uppercase group-hover:text-primary-fixed transition-colors">Conversation</span>
</label>
<label class="flex items-center p-3 bg-surface-container-high brutal-border cursor-pointer group">
<input class="sr-only peer" type="checkbox">
<div class="w-5 h-5 brutal-border peer-checked:bg-primary-fixed peer-checked:border-primary-fixed flex items-center justify-center mr-3 relative">
<span class="material-symbols-outlined text-[16px] text-black absolute opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-mono text-label-mono uppercase group-hover:text-primary-fixed transition-colors">Friendship</span>
</label>
</div>
</section>
<!-- Languages -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-bold text-label-bold uppercase tracking-wider text-on-surface-variant">LANGUAGE_PROTOCOLS</h2>
<div class="flex flex-wrap gap-2">
<span class="bg-[#A855F7] text-black font-label-mono text-label-mono px-3 py-1 cursor-pointer">ENGLISH</span>
<span class="bg-[#A855F7] text-black font-label-mono text-label-mono px-3 py-1 cursor-pointer">HINGLISH</span>
<span class="bg-surface-variant text-on-surface-variant font-label-mono text-label-mono px-3 py-1 brutal-border hover:border-primary-fixed cursor-pointer">HINDI</span>
</div>
</section>

<div class="flex flex-wrap gap-2 items-center">
<span class="bg-surface-container-high brutal-border px-3 py-2 font-label-mono text-label-mono flex items-center gap-2">
                        TECH_POLICY

</span>
<button class="bg-transparent brutal-border border-dashed px-3 py-2 font-label-mono text-label-mono text-primary-fixed hover:bg-surface-container transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span> ADD
                    </button>
</div>
</section>
</main>

<div class="absolute bottom-0 left-0 w-full p-margin-mobile bg-background/90 backdrop-blur-[10px] border-t-2 border-primary z-50">
<button class="w-full bg-primary-fixed text-[#131313] font-label-mono text-[16px] font-bold uppercase py-4 brutal-border hover:shadow-hard-secondary transition-all active:translate-y-1 active:shadow-none flex justify-center items-center gap-2">
                APPLY_PARAMETERS
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">bolt</span>
</button>
</div>
</div>
